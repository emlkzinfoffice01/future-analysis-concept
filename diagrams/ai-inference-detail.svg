<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1740" viewBox="0 0 1840 1740" role="img"><title>図Ⅲ-2 304 AI推論基盤の詳細構成</title><desc>Hotakaが推論、モデル切替、KVキャッシュの状態確認・退避・復元を指示する。llama.cppが推論モデルを読み込み、ホストのメインメモリ上のKVキャッシュと永続ストレージ上の退避ファイルを管理する。Magnitudeは成熟度と必要機能への適合を確認する移行候補。</desc><rect width="1840" height="1740" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="black"/></marker></defs>
