<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1390" viewBox="0 0 1840 1390" role="img">
  <title>図Ⅲ-1 基礎分析結果を用いたAI分析の構成</title>
  <desc>204の基礎分析結果と301の問いを302で入力に構成する。303が304の推論基盤を利用し、305へ結果を保存する。HotakaのH01がモデル切替、H02がKVキャッシュの状態確認・退避・復元を指示し、304のllama.cppが実行する。 302が問い・条件に応じて504へ検索を要求し、503から取得した関連知識と根拠を302へ返す。302でRAG注入を行い、基礎分析結果・問いと共にLLMの推論INPUTを構成する。</desc>
  <rect width="1840" height="1390" fill="white" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="black" />
    </marker>
  </defs>
