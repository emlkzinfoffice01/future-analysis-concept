  <text x="275" y="1209" font-family="MS Mincho,Yu Mincho,serif" font-size="29" text-anchor="middle" fill="black">可視化部</text>
  <text x="275" y="1251" font-family="MS Mincho,Yu Mincho,serif" font-size="25" text-anchor="middle" fill="black">基礎分析結果と解釈の表示</text>
