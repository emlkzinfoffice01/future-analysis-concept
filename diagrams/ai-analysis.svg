  <text x="550" y="1194" font-family="MS Mincho,Yu Mincho,serif" font-size="23" text-anchor="middle" fill="black">分析結果</text>
  <text x="100" y="1353" font-family="MS Mincho,Yu Mincho,serif" font-size="23" text-anchor="start" fill="black">矢印は要求・応答とデータの流れ。Hotakaが管理操作を指示し、304が実行する。</text>
